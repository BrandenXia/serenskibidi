name: Build
on:
  workflow_call:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build, unit tests, and UCI smoke tests
        run: make test
      - name: Upload engine
        uses: actions/upload-artifact@v4
        with:
          name: SerenSkibidi-${{ github.sha }}
          path: |
            SerenSkibidi
            SerenSkibidi.jar
